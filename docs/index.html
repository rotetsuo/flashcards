<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="theme-color" content="#141414">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<script>
  // Destino: o web app do Google Apps Script (acesso "Somente eu").
  // Ao publicar uma versão com URL nova, troque só esta linha.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbw4RsiwBGiHQ9wNo-arZ9-Ul0nHhvKg4PGpgF-2ZzjUaeoIJxllT_DaUqaSCeWMiURruw/exec';
  // Com #instalar no fim do endereço a página não redireciona,
  // para dar tempo de "Adicionar à Tela de Início" com este endereço bonito.
  if (location.hash !== '#instalar') location.replace(APP_URL);
</script>
<style>
  :root { --bg: #f4f2ee; --text: #1d1b18; --muted: #6e6a63; --accent: #2f5bd3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --text: #ecebe8; --muted: #9b9890; --accent: #7d9cff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 12px; font-weight: 700; }
  #install { display: none; text-align: left; margin-top: 20px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>📚 Flashcards</h1>
  <p id="msg">Abrindo…</p>
  <a class="btn" id="go" href="#">Abrir flashcards</a>
  <div id="install">
    <b>Para instalar no celular</b><br>
    iPhone: Compartilhar → Adicionar à Tela de Início.<br>
    Android: ⋮ → Adicionar à tela inicial.<br>
    Depois disso, o ícone abre direto o app.
  </div>
</main>
<script>
  document.getElementById('go').href = APP_URL;
  if (location.hash === '#instalar') {
    document.getElementById('msg').textContent = 'Adicione esta página à tela inicial; ao abrir, ela leva direto para o app.';
    document.getElementById('install').style.display = 'block';
    history.replaceState(null, '', location.pathname); // o atalho salvo fica sem #instalar
  }
</script>
</body>
</html>
